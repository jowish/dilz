name: Restricted scope

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Restricted scope guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if the PR touches protected paths
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED"
          PROTECTED='^(supabase/migrations/|\.github/workflows/|AGENTS\.md|capacitor\.config|ios/|android/|.*\.env)'
          HITS=$(echo "$CHANGED" | grep -E "$PROTECTED" || true)
          if [ -n "$HITS" ]; then
            echo "::error::This PR touches restricted paths (AGENTS.md section 4):"
            echo "$HITS"
            exit 1
          fi
      - name: Fail if RLS policies are edited anywhere
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff "$BASE"...HEAD -U0 | grep -iE '^\+.*(create|alter|drop) +policy'; then
            echo "::error::RLS policy change detected. Human review required."
            exit 1
          fi
