name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  restricted-scope:
    name: Restricted scope guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if the PR touches protected paths
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED"
          PROTECTED='^(supabase/migrations/|\.github/workflows/|AGENTS\.md|capacitor\.config|ios/|android/|.*\.env)'
          HITS=$(echo "$CHANGED" | grep -E "$PROTECTED" || true)
          if [ -n "$HITS" ]; then
            echo "::error::This PR touches restricted paths (AGENTS.md §4):"
            echo "$HITS"
            exit 1
          fi
      - name: Fail if RLS policies are edited anywhere
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff "$BASE"...HEAD -U0 | grep -iE '^\+.*(create|alter|drop) +policy'; then
            echo "::error::RLS policy change detected. Human review required."
            exit 1
          fi
