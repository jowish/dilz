<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <title>Dilz</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff; color: #0b1220; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 18px; color: #0b1220; display: block; }
      strong { display: block; margin-bottom: 16px; font-size: 34px; letter-spacing: -.04em; }
      p { margin: 0 0 22px; color: #4b5563; line-height: 1.6; }
      button { min-height: 48px; padding: 0 22px; border: 0; border-radius: 14px; background: #0b1220; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <circle cx="60" cy="74" r="25" fill="none" stroke="currentColor" stroke-width="18" />
        <rect x="76" y="12" width="18" height="96" rx="2" fill="currentColor" />
      </svg>
      <strong>dILz</strong>
      <p>Dilz needs an internet connection to load current deals and prices.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
